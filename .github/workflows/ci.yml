name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet, test, gofmt
        run: make check

      - name: Lint install script
        run: shellcheck install.sh

  binaries:
    name: Binaries
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build x86_64 and aarch64
        run: make dist

      - name: Smoke-test the x86_64 binary
        run: |
          ./dist/nixtui-linux-x86_64 --version
          ./dist/nixtui-linux-x86_64 help | head -n 3

      - name: Installer end-to-end (local mirror)
        run: |
          python3 -m http.server 8765 --directory dist >/dev/null 2>&1 &
          server=$!
          sleep 1
          NIXTUI_BASE_URL=http://127.0.0.1:8765 NIXTUI_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/nixtui" --version
          kill "$server"

      - name: Update check and self-update end-to-end (local mirror)
        run: |
          mkdir -p "$RUNNER_TEMP/old" "$RUNNER_TEMP/srv"
          # an "old" binary and a newer release served from a local mirror
          go build -ldflags "-X main.version=26.11.0" -o "$RUNNER_TEMP/old/nixtui" .
          go build -ldflags "-X main.version=26.12.0" -o "$RUNNER_TEMP/srv/nixtui-linux-x86_64" .
          (cd "$RUNNER_TEMP/srv" && sha256sum nixtui-linux-x86_64 > sha256sums.txt && printf '{"tag_name":"v26.12.0"}' > latest.json)
          python3 -m http.server 8766 --directory "$RUNNER_TEMP/srv" >/dev/null 2>&1 &
          server=$!
          sleep 1
          export NIXTUI_UPDATE_URL=http://127.0.0.1:8766/latest.json NIXTUI_BASE_URL=http://127.0.0.1:8766 XDG_CACHE_HOME="$RUNNER_TEMP/cache"
          "$RUNNER_TEMP/old/nixtui" update --check | grep -q "26.12.0 is available"
          "$RUNNER_TEMP/old/nixtui" update
          test "$("$RUNNER_TEMP/old/nixtui" --version)" = "nixtui 26.12.0"
          "$RUNNER_TEMP/old/nixtui" update | grep -q "up to date"
          kill "$server"

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: nixtui-binaries
          path: |
            dist/nixtui-linux-*
            dist/sha256sums.txt
          if-no-files-found: error

  nix:
    name: Nix build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build the package (runs the tests, bundles nixfmt)
        run: nix build .#default --print-build-logs

      - name: Smoke-test
        run: |
          ./result/bin/nixtui --version
          printf '{ a=1; }' > "$RUNNER_TEMP/x.nix"
          ./result/bin/nixtui fmt "$RUNNER_TEMP/x.nix"
