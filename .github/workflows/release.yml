name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  build:
    name: Verify & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version
        id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Tag must match VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="${{ steps.ver.outputs.version }}"
          echo "tag=$tag version=$version"
          test "$tag" = "$version"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet, test, gofmt
        run: make check

      - name: Build x86_64 and aarch64 binaries
        run: make dist

      - name: Smoke-test
        run: |
          out="$(./dist/nixtui-linux-x86_64 --version)"
          echo "$out"
          test "$out" = "nixtui ${{ steps.ver.outputs.version }}"

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries
          path: |
            dist/nixtui-linux-x86_64
            dist/nixtui-linux-aarch64
            dist/sha256sums.txt
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: release-binaries
          path: dist

      - name: Verify checksums
        run: cd dist && sha256sum --check sha256sums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: nixtui ${{ needs.build.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/nixtui-linux-x86_64
            dist/nixtui-linux-aarch64
            dist/sha256sums.txt
